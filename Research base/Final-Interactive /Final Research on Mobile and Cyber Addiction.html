<!DOCTYPE html>
<html lang="en" data-theme="light" data-text-size="medium">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Designing Calm Futures — Mobile & Cyber Addiction Research</title>
  <!-- Optional Google Fonts (Outfit + Inter) with clean system fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Typography: adopted working pairing from DESIGN.md */
      --font-display: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      /* Core palette from DESIGN.md */
      --color-background: #EDF0F5;
      --color-header: #F8F9FB;
      --color-surface: #F9FAFC;
      --color-surface-hover: #F1F4F9;
      --color-border: #D9DDE3;
      --color-text: #1F2430;
      --color-wordmark: #3A3F4F;
      --color-text-muted: #5F6573;
      --color-primary: #1A6EF0;
      --color-primary-hover: #1558C0;
      --color-success: #5CC83A;
      --color-success-bg: #EBF9E6;
      --color-success-text: #1F4E10;

      /* Signature gradient (used with restraint) */
      --brand-blue: #2BA8F0;
      --brand-teal: #22D08B;
      --brand-lime: #7FDB22;
      --brand-gradient: linear-gradient(90deg, #2BA8F0 0%, #22D08B 50%, #7FDB22 100%);

      /* Semantic chips from DESIGN.md */
      --chip-experience-bg: #A8C7FA;
      --chip-experience-text: #1F2A44;
      --chip-skill-bg: #B5F55A;
      --chip-skill-text: #2B3A10;
      --chip-neutral-bg: #E3E6EC;
      --chip-neutral-text: #4A4F5C;
      --chip-warm-bg: #FDE8C8;
      --chip-warm-text: #5C3B09;
      --button-disabled-bg: #B9D0FA;

      /* Shape language from DESIGN.md */
      --radius-button: 12px;
      --radius-input: 10px;
      --radius-card: 24px;
      --radius-panel: 28px;
      --radius-chip: 999px;
      --radius-tag: 8px;

      /* Spacing system (8px base grid) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --space-8: 64px;
      --space-9: 80px;

      /* Elevation tokens */
      --shadow-none: none;
      --shadow-subtle: 0 2px 8px rgba(31, 36, 48, 0.04);
      --shadow-card: 0 6px 20px rgba(31, 36, 48, 0.06);
      --shadow-overlay: 0 12px 32px rgba(31, 36, 48, 0.10);

      /* Motion tokens */
      --motion-fast: 150ms;
      --motion-standard: 250ms;
      --motion-reveal: 400ms;
      --ease-out-calm: cubic-bezier(0.22, 1, 0.36, 1);

      /* Dynamic text scale multiplier */
      --font-scale: 1;
    }

    [data-theme="dark"] {
      --color-background: #12151C;
      --color-header: #181C26;
      --color-surface: #1D222E;
      --color-surface-hover: #252B3B;
      --color-border: #2E3646;
      --color-text: #F0F3F8;
      --color-wordmark: #D5DCE6;
      --color-text-muted: #9BA3B4;
      --color-primary: #3B82F6;
      --color-primary-hover: #60A5FA;
      --color-success: #5CC83A;
      --color-success-bg: #1B3316;
      --color-success-text: #A5F08E;

      --chip-experience-bg: #1E3A6D;
      --chip-experience-text: #C7DCFF;
      --chip-skill-bg: #243B0E;
      --chip-skill-text: #C8F97E;
      --chip-neutral-bg: #2A3140;
      --chip-neutral-text: #CFD6E4;
      --chip-warm-bg: #3D2A10;
      --chip-warm-text: #FAD6A0;

      --shadow-subtle: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-card: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    [data-text-size="small"] { --font-scale: 0.92; }
    [data-text-size="medium"] { --font-scale: 1; }
    [data-text-size="large"] { --font-scale: 1.12; }
    [data-text-size="xlarge"] { --font-scale: 1.24; }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: calc(17px * var(--font-scale));
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--motion-standard) ease, color var(--motion-standard) ease;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      color: var(--color-text);
      margin-top: 0;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    h1 {
      font-size: calc(34px * var(--font-scale));
      line-height: 1.18;
      font-weight: 400;
    }

    h2 {
      font-size: calc(24px * var(--font-scale));
      line-height: 1.25;
    }

    h3 {
      font-size: calc(19px * var(--font-scale));
      line-height: 1.35;
    }

    p {
      margin-top: 0;
      margin-bottom: var(--space-4);
      max-width: 66ch;
    }

    a {
      color: var(--color-primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Keyboard focus state */
    :focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 3px;
    }

    /* Skip to content link for screen readers / keyboard users */
    .skip-link {
      position: absolute;
      top: -60px;
      left: var(--space-4);
      background: var(--color-primary);
      color: #fff;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-button);
      z-index: 1000;
      font-weight: 500;
    }
    .skip-link:focus {
      top: var(--space-3);
    }

    /* Header & Progress Bar */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--color-header);
      border-bottom: 1px solid var(--color-border);
      transition: background-color var(--motion-standard) ease;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background-color: var(--color-border);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--brand-gradient);
      width: 0%;
      transition: width var(--motion-reveal) ease;
    }

    .header-inner {
      max-width: 840px;
      margin: 0 auto;
      padding: var(--space-3) var(--space-4);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      background: none;
      border: none;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-button);
      text-align: left;
      color: inherit;
    }

    .brand-block:hover {
      background-color: var(--color-surface-hover);
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--brand-gradient);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: calc(16px * var(--font-scale));
      font-weight: 500;
      color: var(--color-wordmark);
      display: block;
    }

    .brand-subtitle {
      font-size: calc(12px * var(--font-scale));
      color: var(--color-text-muted);
      display: block;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .btn {
      font-family: var(--font-body);
      font-size: calc(14px * var(--font-scale));
      font-weight: 500;
      line-height: 1.3;
      padding: 10px 16px;
      border-radius: var(--radius-button);
      border: 1px solid var(--color-border);
      background-color: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: background-color var(--motion-fast) ease, border-color var(--motion-fast) ease, transform var(--motion-fast) ease;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--color-surface-hover);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      background-color: var(--button-disabled-bg);
      color: rgba(255, 255, 255, 0.85);
      border-color: transparent;
      cursor: not-allowed;
      opacity: 0.65;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #ffffff;
      border-color: var(--color-primary);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    .btn-success {
      background-color: var(--color-success-bg);
      color: var(--color-success-text);
      border-color: var(--color-success);
    }

    .btn-icon {
      padding: 8px 12px;
      font-size: calc(13px * var(--font-scale));
    }

    .btn-active {
      border-color: var(--color-primary);
      background-color: var(--chip-experience-bg);
      color: var(--chip-experience-text);
    }

    /* Main Container */
    .main-container {
      max-width: 780px;
      margin: 0 auto;
      padding: var(--space-6) var(--space-4) var(--space-9);
    }

    /* Toolbar for search and view controls */
    .utility-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: var(--space-3) var(--space-4);
      box-shadow: var(--shadow-subtle);
      transition: opacity var(--motion-standard) ease, transform var(--motion-standard) var(--ease-out-calm), box-shadow var(--motion-standard) ease;
    }

    .card-interactive:hover {
      box-shadow: var(--shadow-card);
    }

    /* Smooth Staggered View Reveal Animation */
    @keyframes calmRevealUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: calmRevealUp var(--motion-reveal) var(--ease-out-calm) both;
    }

    /* Interactive Breathing Pacer & Neuroplasticity Widgets */
    .interactive-widget {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
      box-shadow: var(--shadow-subtle);
      position: relative;
      overflow: hidden;
    }

    .widget-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--brand-gradient);
    }

    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: var(--space-2);
      margin: var(--space-4) 0;
    }

    .stage-tab {
      padding: var(--space-3);
      border-radius: var(--radius-button);
      border: 1px solid var(--color-border);
      background: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: calc(13.5px * var(--font-scale));
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all var(--motion-fast) var(--ease-out-calm);
    }

    .stage-tab:hover {
      background: var(--color-surface-hover);
      transform: translateY(-1px);
    }

    .stage-tab.active {
      border-color: var(--color-primary);
      background: var(--chip-experience-bg);
      color: var(--chip-experience-text);
    }

    .meter-row {
      margin-bottom: var(--space-3);
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: calc(13px * var(--font-scale));
      font-weight: 500;
      margin-bottom: 6px;
    }

    .meter-track {
      height: 10px;
      border-radius: var(--radius-chip);
      background: var(--color-background);
      border: 1px solid var(--color-border);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: var(--radius-chip);
      transition: width 600ms var(--ease-out-calm);
    }

    /* Breathing Pacer Orb */
    .breath-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-5) var(--space-3);
      text-align: center;
    }

    .breath-orb-wrap {
      position: relative;
      width: 136px;
      height: 136px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: var(--space-3) 0 var(--space-4);
    }

    .breath-orb {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--brand-gradient);
      opacity: 0.85;
      transform: scale(1);
      transition: transform 1.8s ease-in-out, opacity 0.6s ease;
      box-shadow: 0 8px 28px rgba(43, 168, 240, 0.22);
    }

    .breath-orb.inhale-1 {
      transform: scale(1.38);
      transition-duration: 1.6s;
    }

    .breath-orb.inhale-2 {
      transform: scale(1.58);
      transition-duration: 0.9s;
    }

    .breath-orb.exhale {
      transform: scale(0.92);
      transition-duration: 3.6s;
    }

    /* Chips & Evidence Tags */
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      align-items: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-chip);
      font-size: calc(12px * var(--font-scale));
      font-weight: 500;
      line-height: 1.4;
    }

    .tag-small {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-tag);
      font-size: calc(11.5px * var(--font-scale));
      font-weight: 500;
      line-height: 1.35;
    }

    /* Evidence & Provenance Colors from DESIGN.md */
    .chip-strong {
      background-color: var(--chip-skill-bg);
      color: var(--chip-skill-text);
    }

    .chip-moderate {
      background-color: var(--chip-experience-bg);
      color: var(--chip-experience-text);
    }

    .chip-experience {
      background-color: var(--chip-warm-bg);
      color: var(--chip-warm-text);
    }

    .chip-weak {
      background-color: var(--chip-neutral-bg);
      color: var(--chip-neutral-text);
    }

    .tag-docs {
      background-color: var(--chip-experience-bg);
      color: var(--chip-experience-text);
    }

    .tag-external {
      background-color: var(--chip-skill-bg);
      color: var(--chip-skill-text);
    }

    .tag-both {
      background-color: var(--chip-neutral-bg);
      color: var(--chip-neutral-text);
    }

    .summary-box {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary);
      border-radius: var(--radius-card);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
      box-shadow: var(--shadow-subtle);
    }

    .summary-label {
      font-size: calc(12px * var(--font-scale));
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-primary);
      font-weight: 600;
      margin-bottom: var(--space-2);
      display: block;
    }

    .summary-list {
      margin: 0;
      padding-left: var(--space-4);
    }

    .summary-list li {
      margin-bottom: var(--space-2);
      color: var(--color-text);
    }
    .summary-list li:last-child {
      margin-bottom: 0;
    }

    /* Collapsible Detail Cards */
    .collapse-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      margin-bottom: var(--space-4);
      overflow: hidden;
      box-shadow: var(--shadow-subtle);
      transition: opacity var(--motion-standard) ease, border-color var(--motion-fast) ease;
    }

    .collapse-header {
      width: 100%;
      background: none;
      border: none;
      padding: var(--space-4) var(--space-5);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      cursor: pointer;
      color: var(--color-text);
      font-family: var(--font-display);
      font-size: calc(19px * var(--font-scale));
      font-weight: 500;
    }

    .collapse-header:hover {
      background-color: var(--color-surface-hover);
    }

    .collapse-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-shrink: 0;
    }

    .collapse-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background-color: var(--color-background);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-muted);
      transition: transform var(--motion-fast) ease;
    }

    .collapse-card[data-open="true"] .collapse-icon {
      transform: rotate(180deg);
      background-color: var(--chip-experience-bg);
      color: var(--chip-experience-text);
    }

    .collapse-body {
      display: none;
      padding: 0 var(--space-5) var(--space-5);
      border-top: 1px solid var(--color-border);
    }

    .collapse-card[data-open="true"] .collapse-body {
      display: block;
      padding-top: var(--space-4);
      animation: calmRevealUp 260ms var(--ease-out-calm) both;
    }

    /* Claim Item inside Collapsible Card */
    .claim-item {
      padding: var(--space-4);
      background-color: var(--color-background);
      border-radius: 16px;
      margin-bottom: var(--space-3);
      border: 1px solid var(--color-border);
      transition: transform var(--motion-fast) var(--ease-out-calm), border-color var(--motion-fast) ease;
    }

    .claim-item:hover {
      border-color: var(--color-primary);
    }

    .claim-item:last-child {
      margin-bottom: 0;
    }

    .claim-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }

    .claim-title {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: calc(16px * var(--font-scale));
      color: var(--color-text);
      margin: 0;
    }

    .claim-text {
      margin: 0;
      font-size: calc(15.5px * var(--font-scale));
      color: var(--color-text);
    }

    /* Two-column Takeaways & App Meaning Grid */
    .insight-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
      margin-top: var(--space-5);
      margin-bottom: var(--space-5);
    }

    @media (min-width: 680px) {
      .insight-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .insight-box {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: var(--space-5);
      box-shadow: var(--shadow-subtle);
    }

    .insight-box ul {
      margin: 0;
      padding-left: var(--space-4);
    }

    .insight-box li {
      margin-bottom: var(--space-2);
    }

    /* Focus Mode Styling: dims everything except the focused block */
    body.focus-mode-active .site-header,
    body.focus-mode-active .utility-bar,
    body.focus-mode-active .section-top-meta,
    body.focus-mode-active .focus-dimmable {
      opacity: 0.22;
      transition: opacity var(--motion-standard) ease;
    }

    body.focus-mode-active .site-header:hover,
    body.focus-mode-active .utility-bar:hover,
    body.focus-mode-active .focus-dimmable:hover,
    body.focus-mode-active .focus-dimmable:focus-within,
    body.focus-mode-active .focus-dimmable.active-focus-target {
      opacity: 1;
    }

    /* Reflection & Quiz Box */
    .reflection-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: var(--space-5);
      margin-top: var(--space-5);
      margin-bottom: var(--space-5);
    }

    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-2);
      border-radius: var(--radius-button);
      border: 1px solid var(--color-border);
      background-color: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: calc(15px * var(--font-scale));
      cursor: pointer;
      transition: background-color var(--motion-fast) ease, border-color var(--motion-fast) ease;
    }

    .quiz-option:hover {
      background-color: var(--color-surface-hover);
    }

    .quiz-option.selected-correct {
      background-color: var(--color-success-bg);
      border-color: var(--color-success);
      color: var(--color-success-text);
      font-weight: 500;
    }

    .quiz-option.selected-gentle {
      background-color: var(--chip-experience-bg);
      border-color: var(--color-primary);
      color: var(--chip-experience-text);
    }

    .quiz-feedback {
      font-size: calc(14px * var(--font-scale));
      padding: var(--space-3);
      border-radius: var(--radius-input);
      background-color: var(--color-background);
      margin-top: var(--space-2);
      margin-bottom: var(--space-4);
      display: none;
    }

    .notes-textarea {
      width: 100%;

    const defaultState = {
      currentView: "home", // "home" | "section" | "bookmarks" | "sources"
      currentSectionIndex: 0,
      completedSections: {}, // { "section-0": true }
      bookmarkedClaims: {},  // { "s0-cl1": true }
      bookmarkedSections: {},// { "section-0": true }
      notes: {},             // { "section-0": "user note text", "general": "..." }
      quizAnswers: {},       // { "section-0_0": 0 }
      theme: "light",
      textSize: "medium",    // "small" | "medium" | "large" | "xlarge"
      focusMode: false
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...defaultState };
        const parsed = JSON.parse(raw);
        return {
          ...defaultState,
          ...parsed,
          completedSections: parsed.completedSections || {},
          bookmarkedClaims: parsed.bookmarkedClaims || {},
          bookmarkedSections: parsed.bookmarkedSections || {},
          notes: parsed.notes || {},
          quizAnswers: parsed.quizAnswers || {}
        };
      } catch (e) {
        return { ...defaultState };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Fallback if private browsing blocks storage
      }
      updateTopChrome();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getEvidenceBadgeClass(ev) {
      const lower = ev.toLowerCase();
      if (lower.includes("strong")) return "chip-strong";
      if (lower.includes("moderate")) return "chip-moderate";
      if (lower.includes("experience") || lower.includes("observational")) return "chip-experience";
      return "chip-weak";
    }

    function getProvenanceBadgeClass(prov) {
      const lower = prov.toLowerCase();
      if (lower.includes("doc")) return "tag-docs";
      if (lower.includes("new")) return "tag-external";
      return "tag-both";
    }

    function getProvenanceLabel(prov) {
      if (prov === "Both") return "Project docs + New research";
      return prov;
    }

    function applyPreferences() {
      document.documentElement.setAttribute("data-theme", state.theme);
      document.documentElement.setAttribute("data-text-size", state.textSize);
      document.body.classList.toggle("focus-mode-active", !!state.focusMode);

      const themeBtn = document.getElementById("btn-theme");
      if (themeBtn) {
        themeBtn.textContent = state.theme === "dark" ? "Light Mode" : "Dark Mode";
      }

      const sizeLabels = { small: "Text: S", medium: "Text: M", large: "Text: L", xlarge: "Text: XL" };
      const sizeBtn = document.getElementById("btn-text-size");
      if (sizeBtn) {
        sizeBtn.textContent = sizeLabels[state.textSize] || "Text: M";
      }

      const focusBtn = document.getElementById("btn-focus-mode");
      if (focusBtn) {
        focusBtn.textContent = state.focusMode ? "Focus Mode: On" : "Focus Mode: Off";
        focusBtn.setAttribute("aria-pressed", state.focusMode ? "true" : "false");
        focusBtn.classList.toggle("btn-active", !!state.focusMode);
      }
    }

    function updateTopChrome() {
      const total = REPORT_DATA.length;
      const doneCount = REPORT_DATA.filter(s => state.completedSections[s.id]).length;
      const pct = Math.round((doneCount / total) * 100);

      const fill = document.getElementById("top-progress-fill");
      if (fill) fill.style.width = pct + "%";

      const statusText = document.getElementById("progress-status-text");
      if (statusText) {
        statusText.textContent = `${doneCount} of ${total} sections done`;
      }

      const savedClaimsCount = Object.keys(state.bookmarkedClaims).filter(k => state.bookmarkedClaims[k]).length;
      const savedSectionsCount = Object.keys(state.bookmarkedSections).filter(k => state.bookmarkedSections[k]).length;
      const totalSaved = savedClaimsCount + savedSectionsCount;
      const badge = document.getElementById("bookmark-count-badge");
      if (badge) badge.textContent = totalSaved;

      // Active state on top nav buttons
      document.getElementById("nav-home")?.classList.toggle("btn-active", state.currentView === "home");
      document.getElementById("nav-bookmarks")?.classList.toggle("btn-active", state.currentView === "bookmarks");
      document.getElementById("nav-sources")?.classList.toggle("btn-active", state.currentView === "sources");
    }

    function renderHomeView() {
      const total = REPORT_DATA.length;
      const doneCount = REPORT_DATA.filter(s => state.completedSections[s.id]).length;

      // Find first unfinished section to suggest
      let nextIndex = REPORT_DATA.findIndex(s => !state.completedSections[s.id]);
      if (nextIndex === -1) nextIndex = 0;
      const nextSection = REPORT_DATA[nextIndex];

      let html = `
        <div class="privacy-banner focus-dimmable animate-in" role="note">
          <span aria-hidden="true" style="font-size:18px;">🛡️</span>
          <div>
            <strong>Participant Privacy Notice:</strong> ${escapeHtml(PRIVACY_NOTE)}
          </div>
        </div>

        <section class="card focus-dimmable animate-in" style="animation-delay: 40ms;" aria-labelledby="start-here-heading">
          <div class="tag-row">
            <span class="chip chip-moderate">Interactive Research Companion</span>
            <span class="tag-small tag-both">Self-paced • Saved locally</span>
          </div>
          <h1 id="start-here-heading" style="margin-bottom: var(--space-3);">
            Take your time. You don't need to finish this today.
          </h1>
          <p style="color: var(--color-text-muted);">
            This interactive companion breaks our master research on mobile and cyber addiction into 7 calm, 5-minute modules. Details stay tucked inside expandable cards so you can explore without cognitive overload.
          </p>
          <div style="display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-top: var(--space-4);">
            <button type="button" class="btn btn-primary" onclick="openSection(${nextIndex})">
              ${doneCount === 0 ? "Start with Section 0" : (doneCount === total ? "Review Section 0" : `Continue: ${escapeHtml(nextSection.number)}`)} →
            </button>
            <span style="font-size: calc(14px * var(--font-scale)); color: var(--color-text-muted);">
              ${doneCount === total ? "All 7 sections read." : `${doneCount} of ${total} completed so far.`}
            </span>
          </div>
        </section>

        <div class="focus-dimmable animate-in" style="animation-delay: 80ms; display:flex; align-items:center; justify-content:space-between; margin: var(--space-6) 0 var(--space-3);">
          <h2 style="margin:0;">All Research Modules</h2>
          <span style="font-size: calc(13px * var(--font-scale)); color: var(--color-text-muted);">One section at a time</span>
        </div>
      `;

      REPORT_DATA.forEach((sec, idx) => {
        const isDone = !!state.completedSections[sec.id];
        const isSaved = !!state.bookmarkedSections[sec.id];
        const delayMs = 100 + idx * 35;
        html += `
          <div class="section-list-item focus-dimmable animate-in" style="animation-delay: ${delayMs}ms;" role="button" tabindex="0" onclick="openSection(${idx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSection(${idx});}">
            <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap: var(--space-2);">
              <div class="tag-row" style="margin-bottom:0;">
                <span class="chip ${isDone ? 'chip-strong' : 'chip-weak'}">
                  ${isDone ? "✓ Done" : escapeHtml(sec.number)}
                </span>
                <span class="tag-small chip-weak">${escapeHtml(sec.readTime)}</span>
                ${isSaved ? `<span class="tag-small chip-moderate">★ Saved</span>` : ""}
              </div>
              <span style="font-size: calc(13px * var(--font-scale)); color: var(--color-primary); font-weight: 500;">Read module →</span>
            </div>
            <div>
              <h3 style="margin: var(--space-1) 0;">${escapeHtml(sec.title)}</h3>
              <p style="margin:0; color: var(--color-text-muted); font-size: calc(15px * var(--font-scale));">
                ${escapeHtml(sec.subtitle)}
              </p>
            </div>
          </div>
        `;
      });

      const view = document.getElementById("app-view");
      view.innerHTML = html;
      attachFocusModeListeners();
    }

    function renderInteractiveWidgetForSection(secId) {
      if (secId === "section-2") {
        const s0 = NEURO_STAGES[0];
        return `
          <section class="interactive-widget focus-dimmable animate-in" aria-label="Interactive 90-Day Neuroplasticity Explorer">
            <div class="widget-accent-bar"></div>
            <div class="tag-row">
              <span class="chip chip-strong">Interactive Simulation</span>
              <span class="tag-small tag-docs">90-Day Brain Rewiring Timeline</span>
            </div>
            <h3 style="margin-bottom: var(--space-1);">Explore How Control Shifts from Effort to Habit</h3>
            <p style="font-size: calc(14.5px * var(--font-scale)); color: var(--color-text-muted); margin-bottom: var(--space-3);">
              Tap each stage below to see how conscious prefrontal effort (System 2) gradually hands the wheel over to automatic basal ganglia habits (System 1).
            </p>
            <div class="stage-tabs" role="tablist">
              ${NEURO_STAGES.map((st, i) => `
                <button type="button" class="stage-tab ${i === 0 ? 'active' : ''}" id="neuro-tab-${i}" onclick="selectNeuroStage(${i})">
                  <div style="font-size: 11.5px; opacity: 0.8;">${escapeHtml(st.stage)}</div>
                  <div>${escapeHtml(st.title)}</div>
                </button>
              `).join("")}
            </div>
            <div class="claim-item" style="margin-bottom:0;">
              <div class="meter-row">
                <div class="meter-label">
                  <span>Conscious Prefrontal Effort (System 2)</span>
                  <span id="neuro-effort-val">${s0.effort}%</span>
                </div>
                <div class="meter-track">
                  <div id="neuro-effort-bar" class="meter-fill" style="width: ${s0.effort}%; background-color: var(--color-primary);"></div>
                </div>
              </div>
              <div class="meter-row">
                <div class="meter-label">
                  <span>Automatic Basal Ganglia Habit (System 1)</span>
                  <span id="neuro-habit-val">${s0.habit}%</span>
                </div>
                <div class="meter-track">
                  <div id="neuro-habit-bar" class="meter-fill" style="width: ${s0.habit}%; background-color: var(--color-success);"></div>
                </div>
              </div>
              <p id="neuro-stage-desc" style="margin: var(--space-3) 0 0; font-size: calc(14.5px * var(--font-scale));">
                ${escapeHtml(s0.summary)}
              </p>
            </div>
          </section>
        `;
      }

      if (secId === "section-3") {
        return `
          <section class="interactive-widget focus-dimmable animate-in" aria-label="Interactive 2-Minute Grounding Bridge Demo">
            <div class="widget-accent-bar"></div>
            <div class="tag-row">
              <span class="chip chip-strong">Interactive Prototype</span>
              <span class="tag-small tag-external">Step 4: The Grounding Bridge</span>
            </div>
            <h3 style="margin-bottom: var(--space-1);">Try the Physiological Sigh Pacer</h3>
            <p style="font-size: calc(14.5px * var(--font-scale)); color: var(--color-text-muted); margin-bottom: var(--space-2);">
              To solve "the void problem" right after closing an app, users can do 3 physiological sighs (two quick nose inhales, followed by one long slow exhale). Try one cycle right here:
            </p>
            <div class="breath-stage">
              <div class="breath-orb-wrap">
                <div id="breath-orb" class="breath-orb"></div>
              </div>
              <div id="breath-status" style="font-family: var(--font-display); font-size: calc(18px * var(--font-scale)); font-weight: 500; margin-bottom: var(--space-3);">
                Ready whenever you are
              </div>
              <button type="button" class="btn btn-primary" id="btn-start-breath" onclick="runBreathingCycle()">
                Try 1 Calming Breath Cycle (7s)
              </button>
            </div>
          </section>
        `;
      }

      return "";
    }

    window.selectNeuroStage = function(idx) {
      const st = NEURO_STAGES[idx];
      if (!st) return;
      NEURO_STAGES.forEach((_, i) => {
        const tab = document.getElementById("neuro-tab-" + i);
        if (tab) tab.classList.toggle("active", i === idx);
      });
      const effortVal = document.getElementById("neuro-effort-val");
      const effortBar = document.getElementById("neuro-effort-bar");
      const habitVal = document.getElementById("neuro-habit-val");
      const habitBar = document.getElementById("neuro-habit-bar");
      const desc = document.getElementById("neuro-stage-desc");

      if (effortVal) effortVal.textContent = st.effort + "%";
      if (effortBar) effortBar.style.width = st.effort + "%";
      if (habitVal) habitVal.textContent = st.habit + "%";
      if (habitBar) habitBar.style.width = st.habit + "%";
      if (desc) desc.textContent = st.summary;
    };

    let breathTimeouts = [];
    window.runBreathingCycle = function() {
      breathTimeouts.forEach(t => clearTimeout(t));
      breathTimeouts = [];

      const orb = document.getElementById("breath-orb");
      const status = document.getElementById("breath-status");
      const btn = document.getElementById("btn-start-breath");
      if (!orb || !status || !btn) return;

      btn.disabled = true;
      orb.className = "breath-orb inhale-1";
      status.textContent = "Inhale steadily through your nose...";

      breathTimeouts.push(setTimeout(() => {
        if (!document.getElementById("breath-orb")) return;
        orb.className = "breath-orb inhale-2";
        status.textContent = "One quick top-up sip of air...";
      }, 1700));

      breathTimeouts.push(setTimeout(() => {
        if (!document.getElementById("breath-orb")) return;
        orb.className = "breath-orb exhale";
        status.textContent = "Long, slow exhale through your mouth...";
      }, 2700));

      breathTimeouts.push(setTimeout(() => {
        if (!document.getElementById("breath-orb")) return;
        orb.className = "breath-orb";
        status.textContent = "Notice your shoulders drop. Ready again whenever you like.";
        btn.disabled = false;
        btn.textContent = "Repeat Breath Cycle (7s)";
      }, 6400));
    };

    function renderSectionView() {
      const idx = state.currentSectionIndex;
      const sec = REPORT_DATA[idx] || REPORT_DATA[0];
      const isDone = !!state.completedSections[sec.id];
      const isBookmarked = !!state.bookmarkedSections[sec.id];

      let html = `
        <div class="section-top-meta animate-in" style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap: var(--space-2); margin-bottom: var(--space-4);">
          <button type="button" class="btn btn-icon" onclick="navigateView('home')">
            ← Back to all modules
          </button>
          <div style="display:flex; flex-wrap:wrap; gap: var(--space-2);">
            <button type="button" class="btn btn-icon ${isBookmarked ? 'btn-active' : ''}" onclick="toggleBookmarkSection('${sec.id}')">
              ${isBookmarked ? "★ Saved for later" : "☆ Save section"}
            </button>
            <button type="button" class="btn btn-icon" onclick="toggleAllCardsInSection(true)">
              Expand all cards
            </button>
            <button type="button" class="btn btn-icon" onclick="toggleAllCardsInSection(false)">
              Collapse all
            </button>
          </div>
        </div>

        <header class="card focus-dimmable animate-in" style="animation-delay: 40ms;">
          <div class="tag-row">
            <span class="chip chip-moderate">${escapeHtml(sec.number)} of ${REPORT_DATA.length - 1}</span>
            <span class="tag-small chip-weak">${escapeHtml(sec.readTime)}</span>
            ${isDone ? `<span class="chip chip-strong">✓ Completed</span>` : ""}
          </div>
          <h1 style="margin-bottom: var(--space-2);">${escapeHtml(sec.title)}</h1>
          <p style="color: var(--color-text-muted); margin-bottom:0;">${escapeHtml(sec.subtitle)}</p>
        </header>

        ${sec.id === "section-1" ? `
          <div class="privacy-banner focus-dimmable animate-in" role="note">
            <span aria-hidden="true" style="font-size:18px;">🔒</span>
            <div>${escapeHtml(PRIVACY_NOTE)}</div>
          </div>
        ` : ""}

        <!-- 3-Line Summary at the Top -->
        <section class="summary-box focus-dimmable animate-in" style="animation-delay: 80ms;" aria-labelledby="summary-heading">
          <span id="summary-heading" class="summary-label">3-Line Summary (The Short Version)</span>
          <ol class="summary-list">
            ${sec.threeLineSummary.map(line => `<li>${escapeHtml(line)}</li>`).join("")}
          </ol>
        </section>

        ${renderInteractiveWidgetForSection(sec.id)}

        <div class="focus-dimmable animate-in" style="animation-delay: 110ms; margin: var(--space-5) 0 var(--space-3); display:flex; align-items:center; justify-content:space-between;">
          <h2 style="margin:0; font-size: calc(20px * var(--font-scale));">Deep-Dive Details (Tap any card to expand)</h2>
        </div>
      `;

      // Collapsible Detail Cards
      sec.cards.forEach((card, cIdx) => {
        const delayMs = 130 + cIdx * 45;
        html += `
          <article class="collapse-card focus-dimmable animate-in" style="animation-delay: ${delayMs}ms;" data-open="false" id="card-${card.id}">
            <button type="button" class="collapse-header" aria-expanded="false" onclick="toggleCollapseCard('${card.id}')">
              <div>
                <div style="font-size: calc(12px * var(--font-scale)); color: var(--color-text-muted); font-family: var(--font-body); font-weight: 500; margin-bottom: 2px;">
                  Part ${cIdx + 1} of ${sec.cards.length} • ${card.claims.length} claims inside
                </div>
                <div>${escapeHtml(card.title)}</div>
                <div style="font-size: calc(14px * var(--font-scale)); color: var(--color-text-muted); font-family: var(--font-body); font-weight: 400; margin-top: 4px;">
                  ${escapeHtml(card.summary)}
                </div>
              </div>
              <div class="collapse-meta">
                <span class="collapse-icon" aria-hidden="true">▼</span>
              </div>
            </button>
            <div class="collapse-body">
              ${card.claims.map(claim => {
                const claimSaved = !!state.bookmarkedClaims[claim.id];
                return `
                  <div class="claim-item" id="claim-${claim.id}">
                    <div class="claim-header">
                      <h4 class="claim-title">${escapeHtml(claim.title)}</h4>
                      <button type="button" class="btn btn-icon ${claimSaved ? 'btn-active' : ''}" style="padding: 4px 10px; font-size: 12px;" onclick="toggleBookmarkClaim('${claim.id}')">
                        ${claimSaved ? "★ Saved" : "☆ Save claim"}
                      </button>
                    </div>
                    <div class="tag-row" style="margin-bottom: var(--space-2);">
                      <span class="chip ${getEvidenceBadgeClass(claim.evidence)}" title="Evidence level">
                        Evidence: ${escapeHtml(claim.evidence)}
                      </span>
                      <span class="tag-small ${getProvenanceBadgeClass(claim.provenance)}" title="Source provenance">
                        ${escapeHtml(getProvenanceLabel(claim.provenance))}
                      </span>
                    </div>
                    <p class="claim-text">${escapeHtml(claim.text)}</p>
                  </div>
                `;
              }).join("")}
            </div>
          </article>
        `;
      });

      // Key Takeaways & Product Design Impact
      html += `
        <div class="insight-grid animate-in" style="animation-delay: 240ms;">
          <section class="insight-box focus-dimmable" aria-labelledby="takeaways-title">
            <div class="tag-row">
              <span class="chip chip-moderate">Key Takeaways</span>
            </div>
            <h3 id="takeaways-title" style="margin-bottom: var(--space-3);">What to remember</h3>
            <ul>
              ${sec.takeaways.map(t => `<li>${escapeHtml(t)}</li>`).join("")}
            </ul>
          </section>

          <section class="insight-box focus-dimmable" aria-labelledby="app-meaning-title">
            <div class="tag-row">
              <span class="chip chip-strong">Product &amp; UX Implications</span>
            </div>
            <h3 id="app-meaning-title" style="margin-bottom: var(--space-3);">How we design for this</h3>
            <ul>
              ${sec.appMeaning.map(m => `<li>${escapeHtml(m)}</li>`).join("")}
            </ul>
          </section>
        </div>
      `;

      // Quick Reflection / Quiz + Shared/Local Note
      const existingNote = state.notes[sec.id] || "";
      html += `
        <section class="reflection-card focus-dimmable animate-in" style="animation-delay: 280ms;" aria-labelledby="reflection-title">
          <div class="tag-row">
            <span class="chip chip-experience">Quick Concept Check &amp; Notes</span>

          <h2 id="reflection-title" style="margin-bottom: var(--space-2);">Pause &amp; Reflect (No pressure, no scores)</h2>
          <p style="color: var(--color-text-muted); font-size: calc(15px * var(--font-scale));">
            Tap an answer to test the core concept, or jot down a quick note in your browser.
          </p>

          ${sec.reflections.map((ref, qIdx) => {
            const answerKey = `${sec.id}_${qIdx}`;
            const chosen = state.quizAnswers[answerKey];
            const hasAnswered = chosen !== undefined;
            return `
              <div style="margin-bottom: var(--space-4);">
                <p style="font-weight: 500; margin-bottom: var(--space-2);">${qIdx + 1}. ${escapeHtml(ref.q)}</p>
                ${ref.options.map((opt, oIdx) => {
                  let btnClass = "quiz-option";
                  if (hasAnswered && chosen === oIdx) {
                    btnClass += (oIdx === ref.correctIndex) ? " selected-correct" : " selected-gentle";
                  }
                  return `
                    <button type="button" class="${btnClass}" onclick="answerQuiz('${sec.id}', ${qIdx}, ${oIdx})">
                      ${escapeHtml(opt)}
                    </button>
                  `;
                }).join("")}
                <div class="quiz-feedback" style="display: ${hasAnswered ? 'block' : 'none'};">
                  ${hasAnswered ? (chosen === ref.correctIndex ? "✓ " + escapeHtml(ref.explanation) : "Not quite — " + escapeHtml(ref.explanation)) : ""}
                </div>
              </div>
            `;
          }).join("")}

          <div style="margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--color-border);">
            <label for="section-note-input" style="font-weight: 500; display:block;">
              Notes for ${escapeHtml(sec.number)}:
            </label>
            <span style="font-size: calc(13.5px * var(--font-scale)); color: var(--color-text-muted);">
              ${escapeHtml(sec.notePrompt)}
            </span>
            <textarea

              class="notes-textarea"
              placeholder="Write a quick thought or review note here... it saves automatically in your browser."
              oninput="saveSectionNote('${sec.id}', this.value)"

            <div id="note-save-indicator" style="font-size: 12px; color: var(--color-text-muted); margin-top: 4px;">
              Saved locally on this device.

        <!-- Mark as Done + Gentle Reward -->

          <h3 style="margin-bottom: var(--space-2);">
            ${isDone ? "You've finished this module." : "Ready to wrap up this module?"}
          </h3>
          <p style="margin: 0 auto var(--space-4); color: var(--color-text-muted); font-size: calc(15px * var(--font-scale));">
            ${isDone
              ? "Nice, steady progress. Take a breath, stretch your shoulders, or move to the next piece whenever you feel like it."
              : "No streaks or flashy confetti—just a quiet check so you know where you left off."}
          </p>
          <button
            type="button"
            class="btn ${isDone ? 'btn-success' : 'btn-primary'}"
            onclick="toggleSectionDone('${sec.id}')"
          >
            ${isDone ? "✓ Marked as done (Tap to undo)" : "Mark section as done"}
          </button>
        </section>

        <!-- Previous / Next Navigation -->
        <nav class="section-footer-nav" aria-label="Section pagination">

            class="btn"
            ${idx === 0 ? "disabled" : ""}

          >
            ← Previous: ${idx > 0 ? escapeHtml(REPORT_DATA[idx - 1].number) : "None"}
          </button>

          <button
            type="button"
            class="btn btn-primary"
            ${idx === REPORT_DATA.length - 1 ? "disabled" : ""}
            onclick="openSection(${idx + 1})"
          >
            Next: ${idx < REPORT_DATA.length - 1 ? escapeHtml(REPORT_DATA[idx + 1].number) : "Finished"} →
          </button>
        </nav>
      `;

      const view = document.getElementById("app-view");
      view.innerHTML = html;
      attachFocusModeListeners();
    }

    function renderBookmarksView() {
      const savedSections = REPORT_DATA.filter(s => state.bookmarkedSections[s.id]);
      const savedClaims = [];
      REPORT_DATA.forEach((sec, sIdx) => {
        sec.cards.forEach(card => {
          card.claims.forEach(claim => {
            if (state.bookmarkedClaims[claim.id]) {
              savedClaims.push({ claim, sectionTitle: sec.title, sectionNumber: sec.number, sectionIndex: sIdx });
            }
          });
        });
      });

      const notesEntries = REPORT_DATA.filter(s => state.notes[s.id] && state.notes[s.id].trim().length > 0);
      const generalNote = state.notes["general"] || "";

      let html = `
        <header class="card focus-dimmable animate-in">
          <div class="tag-row">
            <span class="chip chip-moderate">Saved &amp; Research Notes</span>
            <span class="tag-small tag-docs">100% Stored in Local Browser</span>
          </div>
          <h1 style="margin-bottom: var(--space-2);">Saved Claims &amp; Reading Notes</h1>
          <p style="color: var(--color-text-muted); margin-bottom:0;">
            Everything starred or written down while reading stays privately in this browser.
          </p>
        </header>

        <!-- General Scratchpad -->
        <section class="card focus-dimmable animate-in" style="animation-delay: 50ms;">
          <h2 style="margin-bottom: var(--space-2);">General Research Scratchpad</h2>
          <p style="color: var(--color-text-muted); font-size: calc(14.5px * var(--font-scale));">
            Use this space for overall product ideas, discussion questions, or usability testing notes.
          </p>
          <textarea
            class="notes-textarea"
            placeholder="Type any general notes here..."
            oninput="saveSectionNote('general', this.value)"
          >${escapeHtml(generalNote)}</textarea>
        </section>

        <!-- Section Notes -->
        <section class="card focus-dimmable">
          <h2 style="margin-bottom: var(--space-3);">Notes by Section (${notesEntries.length})</h2>
          ${notesEntries.length === 0 ? `
            <p style="color: var(--color-text-muted); margin:0;">You haven't written any section notes yet. You can add them at the bottom of any section.</p>
          ` : notesEntries.map(sec => {
            const sIdx = REPORT_DATA.findIndex(s => s.id === sec.id);
            return `
              <div class="claim-item">
                <div class="claim-header">
                  <strong>${escapeHtml(sec.number)}: ${escapeHtml(sec.title)}</strong>
                  <button type="button" class="btn btn-icon" onclick="openSection(${sIdx})">Open section →</button>
                </div>
                <p style="white-space: pre-wrap; margin:0;">${escapeHtml(state.notes[sec.id])}</p>
              </div>
            `;
          }).join("")}
        </section>

        <!-- Saved Claims -->
        <section class="card focus-dimmable">
          <h2 style="margin-bottom: var(--space-3);">Saved Claims (${savedClaims.length})</h2>
          ${savedClaims.length === 0 ? `
            <p style="color: var(--color-text-muted); margin:0;">No individual claims saved yet. Tap "☆ Save claim" on any detail card while reading.</p>
          ` : savedClaims.map(item => `
            <div class="claim-item">
              <div class="claim-header">
                <h3 class="claim-title">${escapeHtml(item.claim.title)}</h3>
                <div style="display:flex; gap: 8px;">
                  <button type="button" class="btn btn-icon" style="padding: 4px 10px; font-size: 12px;" onclick="openSection(${item.sectionIndex})">
                    Go to ${escapeHtml(item.sectionNumber)}
                  </button>
                  <button type="button" class="btn btn-icon" style="padding: 4px 10px; font-size: 12px;" onclick="toggleBookmarkClaim('${item.claim.id}')">
                    Remove
                  </button>
                </div>
              </div>
              <div class="tag-row">
                <span class="chip ${getEvidenceBadgeClass(item.claim.evidence)}">Evidence: ${escapeHtml(item.claim.evidence)}</span>
                <span class="tag-small ${getProvenanceBadgeClass(item.claim.provenance)}">${escapeHtml(getProvenanceLabel(item.claim.provenance))}</span>
              </div>
              <p class="claim-text">${escapeHtml(item.claim.text)}</p>
            </div>
          `).join("")}
        </section>

        <!-- Saved Sections -->
        <section class="card focus-dimmable">
          <h2 style="margin-bottom: var(--space-3);">Saved Sections (${savedSections.length})</h2>
          ${savedSections.length === 0 ? `
            <p style="color: var(--color-text-muted); margin:0;">No full sections bookmarked yet.</p>
          ` : savedSections.map(sec => {
            const sIdx = REPORT_DATA.findIndex(s => s.id === sec.id);
            return `
              <div class="claim-item" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap: 12px;">
                <div>
                  <strong>${escapeHtml(sec.number)}: ${escapeHtml(sec.title)}</strong>
                  <div style="font-size: 14px; color: var(--color-text-muted);">${escapeHtml(sec.readTime)}</div>
                </div>
                <div style="display:flex; gap: 8px;">
                  <button type="button" class="btn btn-primary btn-icon" onclick="openSection(${sIdx})">Read →</button>
                  <button type="button" class="btn btn-icon" onclick="toggleBookmarkSection('${sec.id}')">Remove</button>
                </div>
              </div>
            `;
          }).join("")}
        </section>
      `;

      document.getElementById("app-view").innerHTML = html;
      attachFocusModeListeners();
    }

    function renderSourcesView() {
      let html = `
        <header class="card focus-dimmable animate-in">
          <div class="tag-row">
            <span class="chip chip-strong">Master Provenance Table</span>
            <span class="tag-small tag-both">Project Documents + 2024–2026 External Research</span>
          </div>
          <h1 style="margin-bottom: var(--space-2);">Sources &amp; Evidence Mapping</h1>
          <p style="color: var(--color-text-muted); margin-bottom:0;">
            Every claim in this companion comes strictly from the project research documents or verified external behavioral, technical, and legal sources. Nothing is invented.
          </p>
        </header>
      `;

      SOURCES_DATA.forEach((src, idx) => {
        const delayMs = 40 + idx * 30;
        html += `
          <article class="card focus-dimmable animate-in" style="animation-delay: ${delayMs}ms;">
            <div class="tag-row">
              <span class="chip ${getEvidenceBadgeClass(src.evidence)}">Highest Evidence: ${escapeHtml(src.evidence)}</span>
              <span class="tag-small ${getProvenanceBadgeClass(src.type)}">${escapeHtml(src.type)}</span>
            </div>
            <h2 style="font-size: calc(19px * var(--font-scale)); margin-bottom: var(--space-2);">${escapeHtml(src.title)}</h2>
            <p style="margin:0; color: var(--color-text-muted);">${escapeHtml(src.summary)}</p>
          </article>
        `;
      });

      document.getElementById("app-view").innerHTML = html;
      attachFocusModeListeners();
    }

    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        renderCurrentView();
        return;
      }

      const matches = [];
      REPORT_DATA.forEach((sec, sIdx) => {
        // Check section title / summary
        const secMatch =
          sec.title.toLowerCase().includes(q) ||
          sec.subtitle.toLowerCase().includes(q) ||
          sec.threeLineSummary.some(l => l.toLowerCase().includes(q));

        const matchingClaims = [];
        sec.cards.forEach(card => {
          card.claims.forEach(claim => {
            if (
              claim.title.toLowerCase().includes(q) ||
              claim.text.toLowerCase().includes(q) ||
              claim.evidence.toLowerCase().includes(q) ||
              claim.provenance.toLowerCase().includes(q)
            ) {
              matchingClaims.push({ claim, cardTitle: card.title });
            }
          });
        });

        if (secMatch || matchingClaims.length > 0) {
          matches.push({ sec, sIdx, matchingClaims });
        }
      });

      let html = `
        <header class="card">
          <div class="tag-row">
            <span class="chip chip-moderate">Search Results</span>
          </div>
          <h1 style="font-size: calc(24px * var(--font-scale)); margin-bottom: var(--space-2);">
            Found ${matches.length} matching section(s) for "${escapeHtml(query)}"
          </h1>
          <button type="button" class="btn btn-icon" onclick="clearSearch()">← Clear search</button>
        </header>
      `;

      if (matches.length === 0) {
        html += `
          <div class="card">
            <p style="margin:0;">No matches found. Try simpler words like <strong>dopamine</strong>, <strong>Android</strong>, <strong>DPDP</strong>, <strong>Maya</strong>, or <strong>bridge</strong>.</p>
          </div>
        `;
      } else {
        matches.forEach(m => {
          html += `
            <section class="card">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap: 8px; margin-bottom: var(--space-3);">
                <div>
                  <span class="chip chip-weak">${escapeHtml(m.sec.number)}</span>
                  <h2 style="margin: 6px 0 0;">${escapeHtml(m.sec.title)}</h2>
                </div>
                <button type="button" class="btn btn-primary btn-icon" onclick="clearSearchAndOpenSection(${m.sIdx})">
                  Open ${escapeHtml(m.sec.number)} →
                </button>
              </div>
              ${m.matchingClaims.map(mc => `
                <div class="claim-item">
                  <div class="tag-row">
                    <span class="chip ${getEvidenceBadgeClass(mc.claim.evidence)}">Evidence: ${escapeHtml(mc.claim.evidence)}</span>
                    <span class="tag-small ${getProvenanceBadgeClass(mc.claim.provenance)}">${escapeHtml(getProvenanceLabel(mc.claim.provenance))}</span>
                  </div>
                  <h3 class="claim-title" style="margin-bottom: 4px;">${escapeHtml(mc.claim.title)}</h3>
                  <p class="claim-text">${escapeHtml(mc.claim.text)}</p>
                </div>
              `).join("")}
            </section>
          `;
        });
      }

      document.getElementById("app-view").innerHTML = html;
    }

    function renderCurrentView() {
      updateTopChrome();
      if (state.currentView === "home") {
        renderHomeView();
      } else if (state.currentView === "section") {
        renderSectionView();
      } else if (state.currentView === "bookmarks") {
        renderBookmarksView();
      } else if (state.currentView === "sources") {
        renderSourcesView();
      }
    }

    window.navigateView = function(viewName) {
      state.currentView = viewName;
      saveState();
      clearSearchInputOnly();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.openSection = function(index) {
      if (index < 0 || index >= REPORT_DATA.length) return;
      state.currentSectionIndex = index;
      state.currentView = "section";
      saveState();
      clearSearchInputOnly();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.toggleCollapseCard = function(cardId) {
      const cardEl = document.getElementById("card-" + cardId);
      if (!cardEl) return;
      const isOpen = cardEl.getAttribute("data-open") === "true";
      const nextState = !isOpen;
      cardEl.setAttribute("data-open", nextState ? "true" : "false");
      const btn = cardEl.querySelector(".collapse-header");
      if (btn) btn.setAttribute("aria-expanded", nextState ? "true" : "false");
    };

    window.toggleAllCardsInSection = function(openState) {
      document.querySelectorAll(".collapse-card").forEach(cardEl => {
        cardEl.setAttribute("data-open", openState ? "true" : "false");
        const btn = cardEl.querySelector(".collapse-header");
        if (btn) btn.setAttribute("aria-expanded", openState ? "true" : "false");
      });
    };

    window.toggleSectionDone = function(secId) {
      state.completedSections[secId] = !state.completedSections[secId];
      saveState();
      renderCurrentView();
    };

    window.toggleBookmarkSection = function(secId) {
      state.bookmarkedSections[secId] = !state.bookmarkedSections[secId];
      saveState();
      renderCurrentView();
    };

    window.toggleBookmarkClaim = function(claimId) {
      state.bookmarkedClaims[claimId] = !state.bookmarkedClaims[claimId];
      saveState();
      if (state.currentView === "bookmarks") {
        renderBookmarksView();
      } else {
        // Update button in place so open cards don't collapse
        const claimEl = document.getElementById("claim-" + claimId);
        if (claimEl) {
          const btn = claimEl.querySelector("button");
          const isSaved = !!state.bookmarkedClaims[claimId];
          if (btn) {
            btn.className = "btn btn-icon " + (isSaved ? "btn-active" : "");
            btn.textContent = isSaved ? "★ Saved" : "☆ Save claim";
          }
        }
      }
    };

    window.answerQuiz = function(secId, qIdx, optionIdx) {
      state.quizAnswers[`${secId}_${qIdx}`] = optionIdx;
      saveState();
      // Re-render section while preserving open cards
      const openCardIds = Array.from(document.querySelectorAll('.collapse-card[data-open="true"]')).map(el => el.id);
      renderSectionView();
      openCardIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.setAttribute("data-open", "true");
          el.querySelector(".collapse-header")?.setAttribute("aria-expanded", "true");
        }
      });
    };

    window.saveSectionNote = function(secId, text) {
      state.notes[secId] = text;
      saveState();
      const ind = document.getElementById("note-save-indicator");
      if (ind) {
        ind.textContent = "Saved just now ✓";
      }
    };

    function clearSearchInputOnly() {
      const input = document.getElementById("search-input");
      const clearBtn = document.getElementById("search-clear");
      if (input) input.value = "";
      if (clearBtn) clearBtn.style.display = "none";
    }

    window.clearSearch = function() {
      clearSearchInputOnly();
      renderCurrentView();
    };

    window.clearSearchAndOpenSection = function(idx) {
      clearSearchInputOnly();
      openSection(idx);
    };

    function attachFocusModeListeners() {
      document.querySelectorAll(".focus-dimmable").forEach(el => {
        el.addEventListener("click", function() {
          document.querySelectorAll(".focus-dimmable.active-focus-target").forEach(prev => {
            prev.classList.remove("active-focus-target");
          });
          this.classList.add("active-focus-target");
        });
      });
    }

    // Initialize controls on load
    document.addEventListener("DOMContentLoaded", () => {
      applyPreferences();
      renderCurrentView();

      document.getElementById("btn-home-brand").addEventListener("click", () => navigateView("home"));
      document.getElementById("nav-home").addEventListener("click", () => navigateView("home"));
      document.getElementById("nav-bookmarks").addEventListener("click", () => navigateView("bookmarks"));
      document.getElementById("nav-sources").addEventListener("click", () => navigateView("sources"));

      document.getElementById("btn-theme").addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyPreferences();
        saveState();
      });

      document.getElementById("btn-text-size").addEventListener("click", () => {
        const order = ["small", "medium", "large", "xlarge"];
        const nextIdx = (order.indexOf(state.textSize) + 1) % order.length;
        state.textSize = order[nextIdx];
        applyPreferences();
        saveState();
      });

      document.getElementById("btn-focus-mode").addEventListener("click", () => {
        state.focusMode = !state.focusMode;
        applyPreferences();
        saveState();
      });

      const searchInput = document.getElementById("search-input");
      const searchClear = document.getElementById("search-clear");
      searchInput.addEventListener("input", (e) => {
        const val = e.target.value;
        searchClear.style.display = val.length > 0 ? "block" : "none";
        renderSearchResults(val);
      });
      searchClear.addEventListener("click", () => window.clearSearch());

      // Keyboard navigation (Left / Right arrows when reading a section and not typing in an input)
      document.addEventListener("keydown", (e) => {
        const tag = (document.activeElement && document.activeElement.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (state.currentView === "section") {
          if (e.key === "ArrowRight" && state.currentSectionIndex < REPORT_DATA.length - 1) {
            openSection(state.currentSectionIndex + 1);
          } else if (e.key === "ArrowLeft" && state.currentSectionIndex > 0) {
            openSection(state.currentSectionIndex - 1);
          }
        }
      });
    });
  </script>
</body>
</html>
